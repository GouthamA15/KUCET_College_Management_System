name: deployment_package

services:
  app:
    build:
      context: .
      dockerfile: DEPLOYMENT_PACKAGE/Dockerfile
    container_name: kucet-cms-app
    restart: always
    expose:
      - "3000"
    ports:
      - "3000:3000"
    env_file:
      - .env.production
    volumes:
      # Persistent VPS Storage Root mounted to container storage path
      - /var/www/kucet-storage:/app/storage
      # Persistent VPS Database Backup Directory
      - ${DB_BACKUP_PATH:-/var/kucet-db-backup}:/var/kucet-db-backup
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cms-network

  nginx:
    image: nginx:alpine
    container_name: kucet-cms-proxy
    restart: always
    ports:
      - "80:80"
    volumes:
      - ./DEPLOYMENT_PACKAGE/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Read-only mount for Nginx internal X-Accel-Redirect delivery
      - /var/www/kucet-storage:/usr/share/nginx/html/storage:ro
    depends_on:
      - app
    networks:
      - cms-network

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: kucet-cms-monitor
    restart: always
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    networks:
      - cms-network

  db:
    image: mysql:8.0
    container_name: kucet-cms-db
    restart: always
    env_file:
      - .env.production
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kucet_cms}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD}
      MYSQL_USER: ${DB_USER}
      MYSQL_PASSWORD: ${DB_PASSWORD}
    ports:
      - "3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      timeout: 20s
      retries: 10
    networks:
      - cms-network

  redis:
    image: redis:7-alpine
    container_name: kucet-cms-redis
    restart: always
    command: redis-server --appendonly yes
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - cms-network

networks:
  cms-network:
    driver: bridge

volumes:
  db-data:
  redis-data:
  uptime-kuma-data:

name: Production TiDB Cloud Migration (Protected)

on:
  workflow_dispatch:
    inputs:
      confirm_target:
        description: 'Type "production-tidb" to confirm executing Drizzle migrations against Production TiDB Cloud'
        required: true
        type: string

concurrency:
  group: production-tidb-migration
  cancel-in-progress: false

jobs:
  migrate-production-tidb:
    name: Migrate Production TiDB Cloud
    runs-on: ubuntu-24.04
    environment: production
    timeout-minutes: 15
    if: github.ref == 'refs/heads/main' && github.event.inputs.confirm_target == 'production-tidb'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Drizzle Schema Migration Consistency
        run: npm run db:check
        env:
          SKIP_ENV_VALIDATION: 'true'

      - name: Run Protected TiDB Cloud Migrations
        run: npm run db:migrate:prod:tidb
        env:
          MIGRATE_TARGET: production-tidb
          CONFIRM_PRODUCTION_MIGRATION: 'true'
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          DB_HOST: ${{ secrets.DB_HOST }}
          DB_USER: ${{ secrets.DB_USER }}
          DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
          DB_DATABASE: ${{ secrets.DB_DATABASE }}
          DB_PORT: ${{ secrets.DB_PORT }}
          DB_SSL: ${{ secrets.DB_SSL }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}

name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "testvanilla" ]
  pull_request:
    branches: [ "main", "master" ]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install System Optical Tools (Tesseract OCR, ZBar & Poppler)
      run: |
        # Mitigate Azure Ubuntu mirror DNS failure in GitHub Actions
        sudo sed -i 's|azure\.archive\.ubuntu\.com|archive.ubuntu.com|g' /etc/apt/apt-mirrors.txt /etc/apt/sources.list /etc/apt/sources.list.d/*.sources /etc/apt/sources.list.d/*.list 2>/dev/null || true
        echo -e "nameserver 8.8.8.8\nnameserver 1.1.1.1" | sudo tee -a /etc/resolv.conf > /dev/null || true

        # Retry loop with --fix-missing for network resilience
        for i in 1 2 3 4 5; do
          echo "Apt update/install attempt $i..."
          if sudo apt-get update -y && sudo apt-get install -y --no-install-recommends --fix-missing tesseract-ocr zbar-tools poppler-utils; then
            echo "✅ System optical tools installed successfully."
            break
          fi
          echo "⚠️ Attempt $i failed, retrying in 5 seconds..."
          sleep 5
        done
      continue-on-error: true

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Verify Drizzle Schema Migration Consistency
      run: npm run db:check
      env:
        SKIP_ENV_VALIDATION: 'true'

    - name: Run Unit Tests (Vitest)
      run: npm run test:unit

    - name: Build Next.js Production App
      run: npm run build
      env:
        NEXT_PUBLIC_WORKING_ENV: testing
        SKIP_ENV_VALIDATION: 'true'
        JWT_SECRET: 'temporary_secret_at_least_32_chars_long'
        ENCRYPTION_KEY: '12345678901234567890123456789012'

    - name: Cache Playwright Browsers
      uses: actions/cache@v4
      id: playwright-cache
      with:
        path: ~/.cache/ms-playwright
        key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

    - name: Install Playwright Browsers (Chromium)
      if: steps.playwright-cache.outputs.cache-hit != 'true'
      run: npx playwright install --with-deps chromium

    - name: Run Playwright End-to-End Tests
      run: npx playwright test
      env:
        CI: 'true'
        NEXT_PUBLIC_WORKING_ENV: testing
        SKIP_ENV_VALIDATION: 'true'
        ENCRYPTION_KEY: '12345678901234567890123456789012'
        JWT_SECRET: 'temporary_secret_at_least_32_chars_long'

    - name: Upload Playwright Test Artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 14
        if-no-files-found: ignore

  database-migration-runner:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Safe Automated Database Migrations
      run: npm run db:migrate
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_DATABASE: ${{ secrets.DB_DATABASE }}
        DB_PORT: ${{ secrets.DB_PORT }}
        DB_SSL: ${{ secrets.DB_SSL }}
        ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}

name: CI/CD Pipeline

on:
  push:
    branches: [ testvanilla, staging, main ]
  pull_request:
    branches: [ testvanilla, staging, main ]

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: lts/*
    - name: Install dependencies
      run: npm install
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps
    - name: Build Next.js Cloud App
      run: npm run build
      env:
        DB_HOST: ${{ secrets.DB_HOST || 'localhost' }}
        DB_USER: ${{ secrets.DB_USER || 'root' }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD || 'password' }}
        DB_DATABASE: ${{ secrets.DB_DATABASE || 'test_db' }}
        EMAIL_USER: ${{ secrets.EMAIL_USER || 'test@example.com' }}
        BREVO_API_KEY: ${{ secrets.BREVO_API_KEY || 'fake_key' }}
        JWT_SECRET: ${{ secrets.JWT_SECRET || 'test_secret' }}
        CERTIFICATE_SECRET: ${{ secrets.CERTIFICATE_SECRET || 'test_cert' }}
        ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY || '12345678901234567890123456789012' }}
        GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID || 'google_id' }}
        GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET || 'google_secret' }}
        CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME || 'cloud_name' }}
        CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY || 'api_key' }}
        CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET || 'api_secret' }}
        NEXT_PUBLIC_BASE_URL: ${{ secrets.NEXT_PUBLIC_BASE_URL || 'http://localhost:3000' }}
    - name: Run Playwright tests
      run: npx playwright test
      env:
        JWT_SECRET: ${{ secrets.JWT_SECRET }}
        NEXT_PUBLIC_BASE_URL: http://localhost:3000
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

  performance:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Run k6 Load Test
      uses: grafana/k6-action@v0.3.1
      with:
        filename: load-test-attendance.js
        flags: --env BASE_URL=http://localhost:3000

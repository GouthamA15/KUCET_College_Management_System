name: CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "testvanilla" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20.x]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run ESLint
      run: npm run lint

    - name: Verify Drizzle Schema Migration Drift
      run: npx drizzle-kit generate
      env:
        SKIP_ENV_VALIDATION: 'true'

    - name: Run Unit Tests (Vitest)
      run: npm run test:unit

    - name: Build Next.js Production App
      run: npm run build
      env:
        NEXT_PUBLIC_WORKING_ENV: testing
        SKIP_ENV_VALIDATION: 'true'

    - name: Install Playwright Browsers (Chromium)
      run: npx playwright install --with-deps chromium

    - name: Run Playwright End-to-End Tests
      run: npx playwright test
      env:
        CI: 'true'
        NEXT_PUBLIC_WORKING_ENV: testing
        SKIP_ENV_VALIDATION: 'true'
        ENCRYPTION_KEY: '12345678901234567890123456789012'
        JWT_SECRET: 'temporary_secret_at_least_32_chars_long'

    - name: Upload Playwright Test Artifacts
      if: failure()
      uses: actions/upload-artifact@v4
      with:
        name: playwright-report
        path: |
          playwright-report/
          test-results/
        retention-days: 14

  database-migration-runner:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20.x
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Safe Automated Database Migrations
      run: npm run db:migrate
      env:
        DATABASE_URL: ${{ secrets.DATABASE_URL }}
        DB_HOST: ${{ secrets.DB_HOST }}
        DB_USER: ${{ secrets.DB_USER }}
        DB_PASSWORD: ${{ secrets.DB_PASSWORD }}
        DB_DATABASE: ${{ secrets.DB_DATABASE }}
        DB_SSL: ${{ secrets.DB_SSL }}
        ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}

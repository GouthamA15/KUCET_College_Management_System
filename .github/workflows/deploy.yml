name: Auto Deploy to Self-Hosted Server

on:
  push:
    branches:
      - testvanilla  # Trigger only on pushes to the testvanilla branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SERVER_SSH_KEY }}
          port: 22
          script: |
            # 1. Navigate to the project directory
            cd /var/www/kucet-cms

            # 2. Pull the latest changes from GitHub
            git pull origin testvanilla

            # 3. Rebuild and restart the Docker containers
            # We use the specific docker-compose file from the deployment package
            docker compose -f DEPLOYMENT_PACKAGE/docker-compose.yml up -d --build

            # 4. Run database migrations/schema push to ensure DB is in sync
            docker exec kucet-cms-app npm run db:push

            # 5. Optional: Prune unused Docker images to save disk space
            docker image prune -f

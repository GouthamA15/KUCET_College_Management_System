name: Auto Deploy to Self-Hosted Server

on:
  push:
    branches:
      - testvanilla  # Trigger only on pushes to the testvanilla branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}
          # Enable Tailscale SSH on the GitHub runner
          ssh: true

      - name: Deploy via Tailscale SSH
        run: |
          # Use 'tailscale ssh' which handles authentication automatically
          # based on your Tailnet identity and the TAILSCALE_AUTHKEY.
          ssh -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd /var/www/kucet-cms
            git pull origin testvanilla
            docker compose -f DEPLOYMENT_PACKAGE/docker-compose.yml up -d --build
            docker exec kucet-cms-app npm run db:push
            docker image prune -f
          EOF


name: Auto Deploy to Self-Hosted Server

on:
  push:
    branches:
      - testvanilla  # Trigger only on pushes to the testvanilla branch

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Connect to Tailscale
        uses: tailscale/github-action@v3
        with:
          authkey: ${{ secrets.TAILSCALE_AUTHKEY }}

      - name: Deploy via SSH
        run: |
          # 1. Save the SSH Key to a temporary file
          echo "${{ secrets.SERVER_SSH_KEY }}" > deploy_key
          chmod 600 deploy_key

          # 2. Run the deployment commands on the server
          # We use -o StrictHostKeyChecking=no because the Tailscale tunnel is private and secure
          ssh -i deploy_key -o StrictHostKeyChecking=no ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_HOST }} << 'EOF'
            cd /var/www/kucet-cms
            git pull origin testvanilla
            docker compose -f DEPLOYMENT_PACKAGE/docker-compose.yml up -d --build
            docker exec kucet-cms-app npm run db:push
            docker image prune -f
          EOF

name: Playwright Tests
on:
  push:
    branches: [ testvanilla, staging, main ]
  pull_request:
    branches: [ testvanilla, staging, main ]

concurrency:
  group: playwright-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      # Dummy environment variables for Zod validation
      JWT_SECRET: "temporary_secret_at_least_32_chars_long"
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
      NEXT_PUBLIC_BASE_URL: "http://localhost:3000"
      DB_HOST: "localhost"
      DB_USER: "root"
      DB_PASSWORD: "password"
      DB_DATABASE: "test_db"
      EMAIL_USER: "test@example.com"
      BREVO_API_KEY: "dummy_brevo_key"
      BREVO_API_KEY_AUTH_OTP: "dummy_key_otp"
      BREVO_API_KEY_PASSWORD_RECOVERY: "dummy_key_pwd"
      BREVO_API_KEY_SECURITY_ALERTS: "dummy_key_sec"
      BREVO_API_KEY_STAFF_ONBOARDING: "dummy_key_staff"
      BREVO_API_KEY_ADMISSIONS: "dummy_key_adm"
      BREVO_API_KEY_SCHOLARSHIP: "dummy_key_sch"
      BREVO_API_KEY_SYSTEM_OPERATIONS: "dummy_key_sys"
      BREVO_SENDER_EMAIL_AUTH_OTP: "otp@kucet.ac.in"
      BREVO_SENDER_NAME_AUTH_OTP: "KUCET Authentication"
      BREVO_SENDER_EMAIL_PASSWORD_RECOVERY: "recovery@kucet.ac.in"
      BREVO_SENDER_NAME_PASSWORD_RECOVERY: "KUCET Account Recovery"
      BREVO_SENDER_EMAIL_SECURITY_ALERTS: "security@kucet.ac.in"
      BREVO_SENDER_NAME_SECURITY_ALERTS: "KUCET Security"
      BREVO_SENDER_EMAIL_STAFF_ONBOARDING: "staff@kucet.ac.in"
      BREVO_SENDER_NAME_STAFF_ONBOARDING: "KUCET Staff Onboarding"
      BREVO_SENDER_EMAIL_ADMISSIONS: "admissions@kucet.ac.in"
      BREVO_SENDER_NAME_ADMISSIONS: "KUCET Admissions"
      BREVO_SENDER_EMAIL_SCHOLARSHIP: "scholarship@kucet.ac.in"
      BREVO_SENDER_NAME_SCHOLARSHIP: "KUCET Scholarship"
      BREVO_SENDER_EMAIL_SYSTEM_OPERATIONS: "operations@kucet.ac.in"
      BREVO_SENDER_NAME_SYSTEM_OPERATIONS: "KUCET System Operations"
      CERTIFICATE_SECRET: "dummy_cert_secret"
      GOOGLE_CLIENT_ID: "dummy_google_id"
      GOOGLE_CLIENT_SECRET: "dummy_google_secret"
      CLOUDINARY_CLOUD_NAME: "dummy_cloud"
      CLOUDINARY_API_KEY: "123456789"
      CLOUDINARY_API_SECRET: "dummy_cloud_secret"
      NEXT_PUBLIC_SUPABASE_URL: "https://dummy.supabase.co"
      NEXT_PUBLIC_SUPABASE_ANON_KEY: "dummy_anon_key"

    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
    - name: Install dependencies
      run: npm ci
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
    - name: Production Build
      run: npm run build
    - name: Run Playwright tests
      run: npx playwright test
    - uses: actions/upload-artifact@v4
      if: ${{ !cancelled() }}
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 30

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="refresh" content="3">
    <title>Connecting to KUCET Portal...</title>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background: #0b1329;
            color: #f8fafc;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            padding: 24px;
            box-sizing: border-box;
            text-align: center;
        }
        .card {
            background: #111e38;
            border: 1px solid #1e293b;
            border-radius: 16px;
            padding: 44px 32px;
            max-width: 460px;
            width: 100%;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .spinner {
            width: 44px;
            height: 44px;
            border: 3px solid rgba(234, 179, 8, 0.2);
            border-top: 3px solid #eab308;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin: 0 auto 20px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        h1 {
            font-size: 20px;
            font-weight: 700;
            margin: 0 0 10px;
            color: #ffffff;
            letter-spacing: -0.01em;
        }
        p {
            font-size: 14px;
            color: #94a3b8;
            line-height: 1.6;
            margin: 0 0 24px;
        }
        .btn {
            display: inline-block;
            background: #eab308;
            color: #0b1329;
            font-weight: 600;
            font-size: 14px;
            padding: 10px 24px;
            border-radius: 8px;
            text-decoration: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .btn:hover {
            background: #facc15;
            transform: translateY(-1px);
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="spinner"></div>
        <h1>Connecting to KUCET Portal</h1>
        <p>The academic services are briefly synchronizing or initializing. This page will automatically reconnect in a few seconds.</p>
        <a href="javascript:location.reload()" class="btn">Reconnect Now</a>
    </div>
</body>
</html>

user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;

    # WebSocket Connection Upgrade Mapping
    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    # Forwarded Proto Mapping (Preserves Tailscale Funnel / Reverse Proxy HTTPS)
    map $http_x_forwarded_proto $forwarded_proto {
        default $http_x_forwarded_proto;
        ''      $scheme;
    }

    # ALLOW LARGE UPLOADS (Admin/Bulk Import)
    client_max_body_size 0;

    # Gzip Compression
    gzip on;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/json application/javascript application/x-javascript text/javascript image/svg+xml font/woff2 application/wasm;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";

    # In-Memory Microcache for Next.js Static Chunks & Public Assets
    proxy_cache_path /tmp/nginx_cache levels=1:2 keys_zone=STATIC:10m inactive=7d max_size=256m use_temp_path=off;

    server {
        listen 80;
        server_name localhost;

        # Keepalive for Tailscaled & High-Frequency Reverse Proxy Ingress
        keepalive_timeout 120s;
        keepalive_requests 10000;

        # Docker Dynamic DNS Resolver (5s TTL, IPv6 disabled to prevent resolution timeouts)
        # Using variables in proxy_pass forces Nginx to re-resolve container IPs dynamically,
        # preventing 502 Bad Gateway when containers are recreated with new internal IPs.
        resolver 127.0.0.11 valid=5s ipv6=off;
        set $upstream_app http://kucet-cms-app:3000;
        set $upstream_realtime http://kucet-cms-realtime:4000;

        # Fast connection timeout and retry handling
        proxy_connect_timeout 3s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        # Custom Auto-Recovery Error Page for 502/503/504
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }

        # Edge Security: Drop scanning probes against hidden files & dotfiles
        location ~ /\.(?!well-known) {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        # Edge Security: Drop scanning probes against sensitive configuration & database files
        location ~* (\.env|\.git|Dockerfile|docker-compose|\.sql|\.bak|\.swp|\.yml|\.yaml|\.lock)$ {
            deny all;
            access_log off;
            log_not_found off;
            return 404;
        }

        # Real-time WebSocket Gateway (Socket.IO Ingress)
        location /socket.io/ {
            proxy_pass $upstream_realtime;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_read_timeout 86400s;
            proxy_send_timeout 86400s;
            proxy_buffering off;
        }

        # Secure Private Storage
        location /uploads/ {
            rewrite ^/uploads/(.*) /api/assets/view/$1 break;
            proxy_pass $upstream_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
        }

        # Nginx Internal Protected Storage (X-Accel-Redirect)
        location /internal_uploads/ {
            internal;
            alias /usr/share/nginx/html/storage/kucet/;
            expires 1h;
            add_header Cache-Control "private, no-transform, max-age=3600" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header X-Content-Type-Options "nosniff" always;

            location ~* \.(php|pl|py|jsp|sh|cgi)$ {
                deny all;
            }
        }

        # Cache Public Branding & Static Assets
        location /assets/ {
            proxy_pass $upstream_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_cache STATIC;
            proxy_cache_key "$scheme$host$request_uri";
            proxy_cache_valid 200 30d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
            expires 30d;
            access_log off;
            add_header Cache-Control "public, max-age=2592000, immutable";
            add_header X-Cache-Status $upstream_cache_status;
        }

        # Main Application Route
        location / {
            proxy_pass $upstream_app;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $forwarded_proto;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
        }

        # Cache Next.js Static Chunks (In-Memory Microcache)
        location /_next/static {
            proxy_pass $upstream_app;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header Host $host;
            proxy_cache STATIC;
            proxy_cache_key "$scheme$host$request_uri";
            proxy_cache_valid 200 365d;
            proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;
            proxy_buffer_size 16k;
            proxy_buffers 8 32k;
            proxy_busy_buffers_size 64k;
            expires 365d;
            access_log off;
            proxy_hide_header Cache-Control;
            add_header Cache-Control "public, max-age=31536000, immutable" always;
            add_header X-Cache-Status $upstream_cache_status;
        }
    }
}

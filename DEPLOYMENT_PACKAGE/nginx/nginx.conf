user  nginx;
worker_processes  auto;

error_log  /var/log/nginx/error.log warn;
pid        /var/run/nginx.pid;

events {
    worker_connections  1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
                      '$status $body_bytes_sent "$http_referer" '
                      '"$http_user_agent" "$http_x_forwarded_for"';

    access_log  /var/log/nginx/access.log  main;

    sendfile        on;
    keepalive_timeout  65;

    # ALLOW LARGE UPLOADS (Admin/Bulk Import)
    # This removes the Nginx-side limit. Cloudflare still limits to 100MB, 
    # but this allows unlimited uploads when accessing via Local IP or Tailscale.
    client_max_body_size 0;

    # Gzip Compression
    gzip on;
    gzip_proxied any;
    gzip_types text/plain text/xml text/css application/x-javascript;
    gzip_vary on;
    gzip_disable "MSIE [1-6]\.(?!.*SV1)";

    # server {
    #    listen 80;
    #    ...
    # }

    server {
        listen 80;
        server_name localhost; # Replace with your domain

        # Docker DNS resolver
        resolver 127.0.0.11 valid=30s;
        set $upstream_app app;

        # Security Headers
        add_header X-Frame-Options "SAMEORIGIN";
        add_header X-XSS-Protection "1; mode=block";
        add_header X-Content-Type-Options "nosniff";

        # Static Unified Storage (Student Photos, Signatures, Payment Evidence)
        # We use a robust fallback strategy: Nginx serves directly (fast), App serves if Nginx fails (fallback)
        location /uploads/ {
            alias /usr/share/nginx/html/uploads/;
            expires 30d;
            add_header Cache-Control "public, no-transform" always;
            add_header X-Frame-Options "SAMEORIGIN" always;
            add_header X-XSS-Protection "1; mode=block" always;
            add_header X-Content-Type-Options "nosniff" always;
            
            # If Nginx cannot find the file (or permission error), proxy to the app
            # which has a fallback API route for assets.
            try_files $uri @app_fallback;

            # Security: Prevent execution of any scripts in the uploads folder
            location ~* \.(php|pl|py|jsp|sh|cgi)$ {
                deny all;
            }
        }

        location @app_fallback {
            proxy_pass http://$upstream_app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location / {
            proxy_pass http://$upstream_app:3000;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        # Cache Static Assets
        location /_next/static {
            proxy_cache_bypass $http_upgrade;
            proxy_pass http://$upstream_app:3000;
            expires 365d;
            access_log off;
        }
    }
}

name: deployment_package

services:
  app:
    build:
      context: ..
      dockerfile: DEPLOYMENT_PACKAGE/Dockerfile
    container_name: kucet-cms-app
    restart: unless-stopped
    expose:
      - "3000"
    ports:
      # Restrict direct Next.js port to local loopback (traffic must ingress via Nginx)
      - "127.0.0.1:3000:3000"
    env_file:
      - .env.production
    environment:
      - DB_BACKUP_PATH=/app/backups
    volumes:
      # Persistent VPS Storage Root mounted to container storage path
      - /var/www/kucet-storage:/app/storage
      # Persistent VPS Database Backup Directory
      - /var/kucet-db-backup:/app/backups
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:3000/api/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 25s
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - cms-network

  realtime:
    build:
      context: ..
      dockerfile: DEPLOYMENT_PACKAGE/Dockerfile.realtime
    container_name: kucet-cms-realtime
    restart: unless-stopped
    expose:
      - "4000"
    ports:
      # Internal real-time socket server
      - "127.0.0.1:4000:4000"
    env_file:
      - .env.production
    environment:
      - REDIS_URL=redis://redis:6379
      - SOCKET_PORT=4000
      - SOCKET_HOST=0.0.0.0
      - CORS_ORIGIN=*
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://127.0.0.1:4000/health', (r) => process.exit(r.statusCode === 200 ? 0 : 1)).on('error', () => process.exit(1))\""]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s
    depends_on:
      redis:
        condition: service_healthy
    networks:
      - cms-network

  nginx:
    image: nginx:alpine
    container_name: kucet-cms-proxy
    restart: unless-stopped
    ports:
      # Exposed for local reverse proxy and Tailscale Funnel ingress
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      # Read-only mount for Nginx internal X-Accel-Redirect delivery
      - /var/www/kucet-storage:/usr/share/nginx/html/storage:ro
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://127.0.0.1:80/api/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s
    depends_on:
      app:
        condition: service_healthy
      realtime:
        condition: service_healthy
    networks:
      - cms-network

  uptime-kuma:
    image: louislam/uptime-kuma:1
    container_name: kucet-cms-monitor
    restart: unless-stopped
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uptime-kuma-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "node extra/healthcheck.js || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    networks:
      - cms-network

  db:
    image: mysql:8.0
    container_name: kucet-cms-db
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      MYSQL_DATABASE: ${DB_DATABASE:-kucet_cms}
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-}
      MYSQL_USER: ${DB_USER:-}
      MYSQL_PASSWORD: ${DB_PASSWORD:-}
    ports:
      # Restrict database host port strictly to local loopback (prevent LAN/public exposure)
      - "127.0.0.1:3306:3306"
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - cms-network

  redis:
    image: redis:7-alpine
    container_name: kucet-cms-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    ports:
      # Restrict Redis host port strictly to local loopback (prevent unauthenticated access)
      - "127.0.0.1:6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - cms-network

networks:
  cms-network:
    driver: bridge

volumes:
  db-data:
  redis-data:
  uptime-kuma-data:
